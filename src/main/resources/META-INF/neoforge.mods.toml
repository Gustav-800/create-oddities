modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "create_oddities"
version = "0.2.1"
displayName = "Create Oddities"
authors = "Gustav800"
logoFile = "icon.png"
description = '''Create Oddities is a modular collection of fixes, tweaks and additions for Create and its addons. 0.2.1 is an update that keeps the module framework, adds CCA wire support in Create blueprints, and retains the per-sensor unit selector for the Create: Aeronautics velocity sensor. Create is required; Create: Aeronautics / Simulated and Create: Crafts & Additions are optional.'''

[[mixins]]
config = "create_oddities.mixins.json"

[[mixins]]
config = "create_oddities.aeronautics.mixins.json"

[[mixins]]
config = "create_oddities.config.mixins.json"

[[mixins]]
config = "create_oddities.cable.mixins.json"

[[dependencies.create_oddities]]
