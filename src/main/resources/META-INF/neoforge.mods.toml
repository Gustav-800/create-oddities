modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "create_oddities"
version = "0.2.0"
displayName = "Create Oddities"
authors = "Gustav800"
logoFile = "icon.png"
description = '''Create Oddities is a modular collection of fixes, tweaks and additions for Create and its addons. 0.2.0 adds a module/config framework, keeps the wireless typewriter keyguard, and adds a per-sensor unit selector for the Create: Aeronautics velocity sensor (m/s, km/h, knots) with unit-specific max-speed limits. Create is required; Create: Aeronautics / Simulated is optional.'''

[[mixins]]
config = "create_oddities.mixins.json"

[[mixins]]
config = "create_oddities.aeronautics.mixins.json"

[[mixins]]
config = "create_oddities.config.mixins.json"

[[dependencies.create_oddities]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.228,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_oddities]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_oddities]]
modId = "create"
type = "required"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.create_oddities]]
modId = "simulated"
type = "optional"
versionRange = "[1.3.2,)"
ordering = "AFTER"
side = "BOTH"
